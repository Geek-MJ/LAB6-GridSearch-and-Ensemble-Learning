name: Build cleaned PowerGraph datasets

on:
  push:
    branches:
      - feature/step4-baseline
    paths:
      - "src/clean_data.py"
      - "data/processed/cleaning_summary.json"
      - ".github/workflows/build-clean-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - name: Check source integrity
        run: python -m pytest -q tests/test_clean_data.py
      - name: Build cleaned datasets
        run: python -m src.clean_data
      - name: Verify output row counts
        run: |
          python - <<'PY'
          import pandas as pd
          a = pd.read_csv("data/processed/validated_20000.csv.gz")
          b = pd.read_csv("data/processed/unique_18579.csv.gz")
          assert a.shape == (20000, 225)
          assert b.shape == (18579, 225)
          assert b.duplicated().sum() == 0
          PY
      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/validated_20000.csv.gz data/processed/unique_18579.csv.gz data/processed/unique_records_manifest.csv data/processed/cleaning_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible cleaned PowerGraph datasets [skip ci]"
            git push origin HEAD:feature/step4-baseline
          fi
