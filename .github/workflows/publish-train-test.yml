name: Verify and publish two-file train/test handoff

on:
  push:
    branches:
      - fix/train-test-no-overlap
    paths:
      - ".github/workflows/publish-train-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate train.csv and test.csv
        run: python -m src.split_data
      - name: Check split tests
        run: python -m pytest -q tests/test_team_split.py tests/test_clean_data.py tests/test_splits.py
      - name: Execute the complete Mahij notebook
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          from pathlib import Path
          path = Path("notebooks/01_data_audit_executed.ipynb")
          nb = nbformat.read(path, as_version=4)
          client = NotebookClient(nb, timeout=360, kernel_name="python3",
                                  resources={"metadata": {"path": "."}})
          executed = client.execute()
          nbformat.write(executed, path)
          code_cells = [cell for cell in executed.cells if cell.cell_type == "code"]
          assert len(code_cells) == 5
          assert all(cell.execution_count is not None for cell in code_cells)
          assert not any(out.output_type == "error" for cell in code_cells for out in cell.outputs)
          assert "16,018" in "".join(
              str(out.get("text", "")) for out in code_cells[-1].outputs
          )
          print("Executed 5 notebook cells successfully.")
          PY
      - name: Confirm CSV files have zero cross-split duplicate inputs
        run: |
          python - <<'PY'
          import pandas as pd
          train = pd.read_csv("data/processed/train.csv")
          test = pd.read_csv("data/processed/test.csv")
          assert train.shape == (16018,225)
          assert test.shape == (3982,225)
          assert int(train.blackout.sum()) == 3240
          assert int(test.blackout.sum()) == 792
          h1 = set(pd.util.hash_pandas_object(train.drop(columns="blackout"), index=False))
          h2 = set(pd.util.hash_pandas_object(test.drop(columns="blackout"), index=False))
          assert not h1.intersection(h2)
          print("Checked: 20,000 rows total; no shared complete inputs.")
          PY
      - name: Publish only split CSVs and executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/train.csv data/processed/test.csv
          git add notebooks/01_data_audit_executed.ipynb
          git commit -m "Save verified two-file split and executed audit notebook [skip ci]"
          git pull --rebase origin fix/train-test-no-overlap
          git push origin HEAD:fix/train-test-no-overlap
